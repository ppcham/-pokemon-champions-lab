<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Pokémon Champions Lab v0.3</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#18212f;--muted:#748094;--line:#e5e9f1;--accent:#4164f6;--accent2:#eef2ff;--good:#15986c;--warn:#d98213;--bad:#d84d4d;--shadow:0 8px 26px rgba(25,35,55,.08);--r:18px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}.app{max-width:820px;margin:auto;padding:env(safe-area-inset-top) 14px calc(84px + env(safe-area-inset-bottom));min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.93);backdrop-filter:blur(16px);padding:13px 0 10px}
.brand{font-size:21px;font-weight:900;letter-spacing:-.03em}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px;padding:5px;background:#e8ecf4;border-radius:15px}
.tab{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800;color:#667085}.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(25,35,55,.08)}
.screen{display:none}.screen.active{display:block}.section{margin-top:17px}h3{font-size:15px;margin:0 0 10px}.hint{font-size:12px;color:var(--muted);line-height:1.55}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.slot{min-height:116px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:17px;padding:11px;box-shadow:var(--shadow);position:relative}
.slot.empty{border-style:dashed;box-shadow:none;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-weight:800}.num{position:absolute;right:9px;top:8px;font-size:10px;color:#98a2b3}
.name{font-size:14px;font-weight:900;line-height:1.25;padding-right:17px}.types{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.type{font-size:10px;padding:4px 7px;border-radius:999px;background:#f0f2f6;color:#475467}
.role{font-size:11px;color:var(--muted);margin-top:7px}.stats{font-size:10px;color:#98a2b3;margin-top:5px}.actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{border:0;border-radius:13px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:850}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:var(--accent2);color:var(--accent)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.kpi b{font-size:18px;display:block}.kpi span{font-size:10px;color:var(--muted)}
.rec-list{display:grid;gap:10px}.rec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.rec-head{display:flex;justify-content:space-between;gap:10px}.rec-name{font-weight:900}.score{font-weight:950;color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tag{font-size:10px;padding:5px 8px;background:#f3f5f8;border-radius:999px}.reason{font-size:12px;line-height:1.55;color:#475467}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{background:#f7f8fb;border-radius:12px;padding:9px;font-size:11px}.mini b{display:block;margin-bottom:4px}.moves{grid-column:1/-1}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}.metric{display:grid;grid-template-columns:110px 1fr 35px;gap:9px;align-items:center;font-size:12px;margin:9px 0}
.track{height:8px;background:#edf0f5;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:999px}.issue{font-size:12px;line-height:1.55;border-top:1px solid var(--line);padding:10px 0}.issue:first-child{border-top:0}.good{color:var(--good);font-weight:850}.bad{color:var(--bad);font-weight:850}
.battle-grid{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:start}.fighter{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:var(--shadow)}.vs{text-align:center;font-weight:900;color:#98a2b3;padding-top:50px}
.select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;margin-top:8px}.move-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.move{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;text-align:left;font-weight:800}.move small{display:block;color:var(--muted);font-weight:600;margin-top:3px}
.result{margin-top:10px;background:#111827;color:#fff;border-radius:16px;padding:13px}.result .big{font-size:20px;font-weight:900}.result .small{font-size:11px;color:#cbd5e1;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.38);display:none;align-items:flex-end;z-index:30}.modal.open{display:flex}.sheet{width:100%;max-width:820px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:15px 14px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:16px;outline:none}.picker-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left}.pick b{display:block}.pick small{color:var(--muted)}.close{float:right;border:0;background:#f2f4f7;border-radius:999px;width:32px;height:32px;font-weight:900}
@media(max-width:560px){.team{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr}.moves{grid-column:auto}}
</style>
</head>

</div>

function role(p){if(!p)return "";const mx=Math.max(p.A,p.C),bulk=Math.max(p.B,p.D);if(p.S>=115)return mx>=120?"高速アタッカー":"高速";if(bulk>=135)return"耐久";if(mx>=135)return p.A>=p.C?"物理火力":"特殊火力";return p.A>=p.C?"物理寄り":"特殊寄り"}
function ap(p){if(!p)return "";const r=role(p);if(r==="耐久")return p.B>=p.D?"H32 / B32 / S2":"H32 / D32 / S2";if(p.S>=105)return p.A>=p.C?"A32 / S32 / H2":"C32 / S32 / H2";return p.A>=p.C?"A32 / H32 / S2":"C32 / H32 / S2"}
function eff(def,atk){if(!def)return 1;return(TC[def]&&TC[def][atk]!=null)?TC[def][atk]:1}
function defensiveVector(p){const out={};DB.attackTypes.forEach(a=>out[a]=eff(p.t1,a)*(p.t2?eff(p.t2,a):1));return out}
function teamWeakness(){const arr=team.filter(Boolean),out={};DB.attackTypes.forEach(a=>out[a]=arr.reduce((s,p)=>s+(defensiveVector(p)[a]>1?1:0),0));return out}
function candidateScore(p){if(team.some(x=>x&&x.name===p.name))return-9999;const w=teamWeakness(),v=defensiveVector(p);let s=0;DB.attackTypes.forEach(a=>{if(w[a]>=2)s+=v[a]===0?7*w[a]:v[a]<1?4*w[a]:v[a]>1?-3*w[a]:0;else if(w[a]===1)s+=v[a]===0?4:v[a]<1?2:v[a]>1?-1:0});if(p.S>=115)s+=3;if(Math.max(p.A,p.C)>=140)s+=2;if(Math.max(p.B,p.D)>=140)s+=2;const types=team.filter(Boolean).flatMap(x=>[x.t1,x.t2]).filter(Boolean);if(types.includes(p.t1))s-=1;if(p.t2&&types.includes(p.t2))s-=1;return s}
const utilityPriority=["つるぎのまい","わるだくみ","めいそう","りゅうのまい","ビルドアップ","じこさいせい","はねやすめ","ちょうはつ","おにび","でんじは","ステルスロック","トリック","みがわり","まもる","アンコール","おいかぜ","トリックルーム"];
function recommendMoves(p){const ls=(L[p.name]||[]).map(n=>[n,M[n]]).filter(x=>x[1]),preferred=p.A>=p.C?"物理":"特殊";const attacks=ls.filter(x=>x[1].power>0).map(([n,m])=>{let sc=(m.power||0)/8;if(m.cat===preferred)sc+=12;if(m.type===p.t1||m.type===p.t2)sc+=14;if((m.prio||0)>0)sc+=4;return{n,m,sc}}).sort((a,b)=>b.sc-a.sc);const picked=[],usedTypes=new Set();for(const x of attacks){if(picked.length>=3)break;if(!usedTypes.has(x.m.type)||picked.length<2){picked.push(x.n);usedTypes.add(x.m.type)}}const utils=utilityPriority.filter(n=>ls.some(x=>x[0]===n));if(utils.length)picked.push(utils[0]);for(const x of attacks){if(picked.length>=4)break;if(!picked.includes(x.n))picked.push(x.n)}return picked.slice(0,4)}
function itemIdea(p){if(p.name.startsWith("メガ"))return"対応メガストーン";const r=role(p);if(r.includes("高速"))return"いのちのたま / きあいのタスキ";if(r==="耐久")return"たべのこし / ゴツゴツメット";return"いのちのたま / ラムのみ"}
function reason(p){const w=teamWeakness(),v=defensiveVector(p),covered=DB.attackTypes.filter(a=>w[a]>=2&&v[a]<1).sort((a,b)=>w[b]-w[a]).slice(0,3),blocked=DB.attackTypes.filter(a=>w[a]>=2&&v[a]===0).slice(0,2),s=[];if(blocked.length)s.push(blocked.join("・")+"を無効");if(covered.length)s.push(covered.join("・")+"の共通弱点を軽減");if(p.S>=115)s.push("高速枠を追加");if(Math.max(p.B,p.D)>=140)s.push("受け先になりやすい");return s.length?s.join("。")+"。":"役割・数値面で候補。"}
function topRecs(){return[...P].map(p=>({p,score:candidateScore(p)})).filter(x=>x.score>-9999).sort((a,b)=>b.score-a.score).slice(0,6)}

function renderTeam(){const el=document.getElementById("team");el.innerHTML="";for(let i=0;i<6;i++){const p=team[i],b=document.createElement("button");b.className="slot"+(p?"":" empty");b.onclick=()=>openPicker(i);if(!p)b.innerHTML=`＋ 追加<div class="num">${i+1}</div>`;else b.innerHTML=`<div class="num">${i+1}</div><div class="name">${p.name}</div><div class="types"><span class="type">${p.t1}</span>${p.t2?`<span class="type">${p.t2}</span>`:""}</div><div class="role">${role(p)}</div><div class="stats">A${p.A} C${p.C} S${p.S}</div>`;el.appendChild(b)}renderSummary();renderBattleSelectors();renderDiag()}
function renderSummary(){const arr=team.filter(Boolean),weak=teamWeakness(),common=Object.values(weak).filter(x=>x>=2).length,fast=arr.filter(p=>p.S>=110).length;document.getElementById("summary").innerHTML=`<div class="kpi"><b>${arr.length}/6</b><span>選択済み</span></div><div class="kpi"><b>${common}</b><span>共通弱点</span></div><div class="kpi"><b>${fast}</b><span>S110+</span></div>`}
function renderRecs(){const list=document.getElementById("recs");list.innerHTML="";topRecs().forEach(({p,score})=>{const moves=recommendMoves(p),d=document.createElement("div");d.className="rec";d.innerHTML=`<div class="rec-head"><div class="rec-name">${p.name}</div><div class="score">${score}</div></div><div class="tags"><span class="tag">${p.t1}</span>${p.t2?`<span class="tag">${p.t2}</span>`:""}<span class="tag">${role(p)}</span></div><div class="reason">${reason(p)}</div><div class="details"><div class="mini"><b>推奨AP</b>${ap(p)}</div><div class="mini"><b>持ち物案</b>${itemIdea(p)}</div><div class="mini moves"><b>技4候補</b>${moves.join(" / ")||"候補計算中"}</div></div><div class="actions"><button class="btn ghost adopt">空き枠に採用</button></div>`;d.querySelector(".adopt").onclick=()=>{const idx=team.findIndex(x=>!x);if(idx>=0){team[idx]=p;renderTeam();renderRecs()}};list.appendChild(d)})}
function openPicker(i){editSlot=i;document.getElementById("picker").classList.add("open");document.getElementById("search").value="";renderPicker("")}
function renderPicker(q){const list=document.getElementById("pickerList");list.innerHTML="";P.filter(p=>p.name.includes(q)).slice(0,80).forEach(p=>{const b=document.createElement("button");b.className="pick";b.innerHTML=`<b>${p.name}</b><small>${p.t1}${p.t2?" / "+p.t2:""} ・ ${role(p)}</small>`;b.onclick=()=>{team[editSlot]=p;document.getElementById("picker").classList.remove("open");renderTeam();renderRecs()};list.appendChild(b)})}
function renderDiag(){const arr=team.filter(Boolean),weak=teamWeakness(),common=DB.attackTypes.filter(a=>weak[a]>=2).sort((a,b)=>weak[b]-weak[a]),phys=arr.filter(p=>p.A>=p.C).length,spec=arr.length-phys,fast=arr.filter(p=>p.S>=110).length,complement=Math.max(0,100-common.length*9),balance=arr.length?Math.max(30,100-Math.abs(phys-spec)*12):0,speed=Math.min(100,40+fast*14),bulk=Math.min(100,40+arr.filter(p=>Math.max(p.B,p.D)>=120).length*12);document.getElementById("metrics").innerHTML=[["タイプ補完",complement],["物特バランス",balance],["素早さ",speed],["耐久",bulk]].map(x=>`<div class="metric"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}</b></div>`).join("");const issues=[];if(common.length)issues.push(`<div class="issue"><span class="bad">注意</span> 共通弱点：${common.slice(0,5).map(a=>a+"("+weak[a]+")").join("、")}</div>`);if(fast>=2)issues.push(`<div class="issue"><span class="good">◎</span> S110以上が${fast}体。高速ルートを作りやすい。</div>`);if(phys>0&&spec>0)issues.push(`<div class="issue"><span class="good">◎</span> 物理${phys} / 特殊${spec}で攻撃方向を分けられる。</div>`);const best=topRecs()[0];if(best)issues.push(`<div class="issue"><b>改善候補：</b>${best.p.name} — ${reason(best.p)}</div>`);document.getElementById("issues").innerHTML=issues.join("")}
function renderBattleSelectors(){const my=document.getElementById("mySelect"),foe=document.getElementById("foeSelect"),teamNames=team.filter(Boolean).map(p=>p.name),myVal=my.value,foeVal=foe.value;my.innerHTML=teamNames.map(n=>`<option>${n}</option>`).join("");foe.innerHTML=P.map(p=>`<option>${p.name}</option>`).join("");if(teamNames.includes(myVal))my.value=myVal;if(byName[foeVal])foe.value=foeVal;else foe.value="ガブリアス";updateBattle()}
function infoHTML(p){return p?`<div class="types"><span class="type">${p.t1}</span>${p.t2?`<span class="type">${p.t2}</span>`:""}</div><div class="role">${role(p)} ・ AP ${ap(p)}</div><div class="stats">H${p.H} A${p.A} B${p.B} C${p.C} D${p.D} S${p.S}</div>`:""}
function updateBattle(){const me=byName[document.getElementById("mySelect").value],foe=byName[document.getElementById("foeSelect").value];document.getElementById("myInfo").innerHTML=infoHTML(me);document.getElementById("foeInfo").innerHTML=infoHTML(foe);const list=document.getElementById("battleMoves");list.innerHTML="";(L[me?.name]||[]).map(n=>[n,M[n]]).filter(x=>x[1]).sort((a,b)=>(b[1].power||0)-(a[1].power||0)).slice(0,12).forEach(([n,m])=>{const b=document.createElement("button");b.className="move";b.innerHTML=`${n}<small>${m.type} / ${m.cat} / 威力 ${m.power||"—"}</small>`;list.appendChild(b)})}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById(t.dataset.tab).classList.add("active")});
document.getElementById("clear").onclick=()=>{team=[null,null,null,null,null,null];renderTeam();renderRecs()};document.getElementById("refresh").onclick=renderRecs;
document.getElementById("close").onclick=()=>document.getElementById("picker").classList.remove("open");document.getElementById("picker").onclick=e=>{if(e.target.id==="picker")document.getElementById("picker").classList.remove("open")};document.getElementById("search").oninput=e=>renderPicker(e.target.value.trim());
document.getElementById("mySelect").onchange=updateBattle;document.getElementById("foeSelect").onchange=updateBattle;
document.getElementById("jsStatus").textContent="● 操作OK";document.getElementById("jsStatus").style.color="#15986c";renderTeam();renderRecs();
</script>
</body></html>
